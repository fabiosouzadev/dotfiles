<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acoplamentos — Chezmoi Dotfiles</title>
<style>
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --card: #161b22; --accent: #58a6ff; --green: #3fb950; --orange: #d29922;
    --red: #f85149; --purple: #bc8cff; --cyan: #39d2c0; --pink: #f778ba;
    --font: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
    --card: #ffffff; --accent: #0969da; --green: #1a7f37; --orange: #9a6700;
    --red: #cf222e; --purple: #8250df; --cyan: #0891b2; --pink: #bf3989;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--fg); min-height: 100vh; padding: 24px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .toolbar button { background: var(--card); color: var(--fg); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search-input { background: var(--card); color: var(--fg); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; min-width: 200px; }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .graph-container { position: relative; width: 100%; height: 72vh; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--bg); cursor: grab; }
  .graph-container:active { cursor: grabbing; }
  .graph-container svg { width: 100%; height: 100%; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .tooltip { position: fixed; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; pointer-events: none; z-index: 100;
    max-width: 340px; font-size: 0.82rem; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; transition: opacity 0.15s; }
  .tooltip.visible { opacity: 1; }
  .tooltip h3 { font-size: 0.95rem; margin-bottom: 6px; color: var(--accent); }
  .tooltip .category { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
  .tooltip .desc { color: var(--fg); line-height: 1.5; }
  .tooltip .deps { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .tooltip .deps span { display: inline-block; background: var(--accent); color: #fff;
    padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; margin: 2px 3px 2px 0; }
  .node circle { stroke-width: 2.5; transition: stroke-width 0.2s; cursor: pointer; }
  .node:hover circle { stroke-width: 4; }
  .node text { fill: var(--fg); font-size: 11px; pointer-events: none; font-family: var(--font); }
  .link { stroke: var(--border); stroke-opacity: 0.6; transition: stroke-opacity 0.2s; }
  .link.highlighted { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2.5; }
  .node.dimmed { opacity: 0.15; }
  .link.dimmed { stroke-opacity: 0.05; }
  .details-panel { position: absolute; top: 12px; right: 12px; width: 300px; max-height: 70vh;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; overflow-y: auto; display: none; font-size: 0.82rem; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .details-panel.open { display: block; }
  .details-panel h2 { font-size: 1rem; color: var(--accent); margin-bottom: 8px; }
  .details-panel .close-btn { position: absolute; top: 8px; right: 10px; background: none;
    border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
  .details-panel section { margin-bottom: 12px; }
  .details-panel section h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase;
    letter-spacing: 0.5px; }
  .details-panel ul { list-style: none; padding: 0; }
  .details-panel li { padding: 3px 0; }
  .details-panel li a { color: var(--accent); text-decoration: none; }
  .details-panel li a:hover { text-decoration: underline; }
  .stats-bar { display: flex; gap: 20px; margin-bottom: 16px; font-size: 0.82rem; color: var(--muted); }
  .stats-bar strong { color: var(--fg); }
  @media (max-width: 768px) { .details-panel { width: 240px; } .graph-container { height: 55vh; } }
</style>
</head>

<p class="subtitle">Mapa visual de dependências e acoplamentos entre componentes do repositório de dotfiles</p>

<div class="stats-bar">
  <span>Nós: <strong>42</strong></span>
  <span>Conexões: <strong id="link-count">—</strong></span>
  <span>Categorias: <strong>9</strong></span>

<div class="toolbar">

  <button id="btn-reset" title="Resetar view">↺ Resetar</button>
  <button id="btn-fit" title="Ajustar ao viewport">⊞ Ajustar</button>

const LINKS = [

  {s:"chezmoi",t:"age"},{s:"chezmoi",t:"gpg"},{s:"chezmoi",t:"git"},{s:"chezmoi",t:"curl"},
  // Shell chain
  {s:"zsh",t:"zinit"},{s:"zinit",t:"starship"},{s:"zinit",t:"eza"},{s:"zinit",t:"ripgrep"},
  {s:"zinit",t:"fzf"},{s:"zinit",t:"zsh-vi-mode"},{s:"zsh",t:"atuin"},{s:"zsh",t:"zoxide"},
  {s:"zsh",t:"fzf"},{s:"zsh",t:"starship"},{s:"zsh",t:"eza"},{s:"zsh",t:"ripgrep"},
  // AI gateways
  {s:"hermes",t:"coding-orch"},{s:"omniroute",t:"coding-orch"},{s:"coding-orch",t:"aider"},
  {s:"coding-orch",t:"claude-code"},{s:"coding-orch",t:"codex"},{s:"coding-orch",t:"opencode"},
  {s:"coding-orch",t:"gemini"},{s:"coding-orch",t:"openclaude"},{s:"coding-orch",t:"cody"},
  {s:"coding-orch",t:"codereviewer"},{s:"coding-orch",t:"cursor"},{s:"coding-orch",t:"gsd"},
  {s:"coding-orch",t:"openspec"},{s:"hermes",t:"omniroute"},{s:"omniroute",t:"ollama"},
  {s:"hermes",t:"ollama"},{s:"coding-orch",t:"ollama"},{s:"hermes",t:"aider"},
  {s:"coding-orch",t:"aider"},{s:"hermes",t:"claude-code"},{s:"coding-orch",t:"claude-code"},
  {s:"omniroute",t:"codex"},{s:"omniroute",t:"copilot"},{s:"coding-orch",t:"copilot"},
  {s:"omniroute",t:"gemini"},{s:"omniroute",t:"openclaude"},{s:"omniroute",t:"cody"},
  {s:"omniroute",t:"codereviewer"},{s:"omniroute",t:"cursor"},{s:"omniroute",t:"gsd"},
  {s:"omniroute",t:"openspec"},{s:"omniroute",t:"hermes"},
  // Services
  {s:"hermes-dash",t:"systemd"},{s:"hermes-dash",t:"hermes"},{s:"omniroute-svc",t:"systemd"},
  {s:"omniroute-svc",t:"omniroute"},{s:"omniroute-svc",t:"hermes"},{s:"hermes-dash",t:"caddy"},
  {s:"omniroute-svc",t:"caddy"},
  // WM/editor connections
  {s:"hyprland",t:"i3"},{s:"niri",t:"i3"},{s:"picom",t:"hyprland"},{s:"picom",t:"i3"},
  {s:"dunst",t:"hyprland"},{s:"dunst",t:"i3"},{s:"neovim",t:"tmux"},{s:"wezterm",t:"tmux"},
  {s:"kitty",t:"tmux"},{s:"tmux",t:"zsh"},{s:"neovim",t:"zsh"},
  // AI tools -> shell
  {s:"aider",t:"zsh"},{s:"claude-code",t:"zsh"},{s:"codex",t:"zsh"},{s:"starship",t:"zsh"},
  {s:"atuin",t:"zsh"},{s:"fzf",t:"zsh"},{s:"zoxide",t:"zsh"},{s:"eza",t:"zsh"},

  {s:"opencode",t:"zsh"},{s:"openclaude",t:"zsh"},{s:"gemini",t:"zsh"},{s:"copilot",t:"zsh"},

  {s:"copilot",t:"omniroute"},{s:"gemini",t:"omniroute"},{s:"openclaude",t:"omniroute"},
  {s:"cody",t:"omniroute"},{s:"codereviewer",t:"omniroute"},{s:"cursor",t:"omniroute"},

  // Net/Infra
  {s:"tailscale",t:"ssh"},{s:"openvpn",t:"ssh"},{s:"ssh",t:"git"},{s:"caddy",t:"omniroute"},
  {s:"caddy",t:"hermes-dash"},{s:"omniroute",t:"ssh"},{s:"hermes",t:"ssh"},
  // Data/sync
  {s:"hermes-sync",t:"hermes"},{s:"omniroute-sync",t:"omniroute"},{s:"hermes-sync",t:"chezmoi"},
  {s:"omniroute-sync",t:"chezmoi"},{s:"chezmoi-data",t:"chezmoi"},{s:"repos.json",t:"chezmoi"},
  {s:"ai_tools",t:"chezmoi"},{s:"ai_tools",t:"aider"},{s:"ai_tools",t:"claude-code"},
  {s:"ai_tools",t:"codex"},{s:"ai_tools",t:"copilot"},{s:"ai_tools",t:"gemini"},
  {s:"ai_tools",t:"openclaude"},{s:"ai_tools",t:"cody"},{s:"ai_tools",t:"cursor"},
  {s:"ai_tools",t:"gsd"},{s:"ai_tools",t:"openspec"},{s:"ai_tools",t:"ollama"},
  {s:"repos.json",t:"git"},{s:"repos.json",t:"ssh"},{s:"repos.json",t:"neovim"},
  // Zsh plugins -> AI
  {s:"zinit",t:"hermes"},{s:"zinit",t:"omniroute"},
  // Editor connections
  {s:"vscode",t:"zsh"},{s:"vscode",t:"omniroute"},

  {s:"coding-orch",t:"systemd"},{s:"coding-orch",t:"hermes-sync"},{s:"coding-orch",t:"omniroute-sync"},
];

// ===== CONFIG =====
const CAT_COLORS = {
  core:"#58a6ff", shell:"#3fb950", ai:"#bc8cff", "ai-tools":"#d29922",
  wm:"#f85149", terminal:"#39d2c0", editor:"#f778ba", services:"#8b949e",
  net:"#ff7b72", data:"#79c0ff", sync:"#7ee787"
};
const CAT_LABELS = {
  core:"Core", shell:"Shell", ai:"IA — Gateways", "ai-tools":"IA — Ferramentas",
  wm:"Window Managers", terminal:"Terminais", editor:"Editores", services:"Serviços",
  net:"Rede/VPN", data:"Dados", sync:"Sync/Backup"
};

// ===== STATE =====
let transform = {x:0,y:0,scale:1};
let physicsOn = true;
let selectedNode = null;
let svg, g, linkSel, nodeSel, simulation;
let nodes = NODES.map(n=>({...n, x:0, y:0, vx:0, vy:0})),
    links = LINKS.map(l=>({source:l.s,target:l.t}));

// ===== INIT =====
function init() {
  svg = document.getElementById("svg-graph");
  g = document.createElementNS("http://www.w3.org/2000/svg","g");
  svg.appendChild(g);

  // Legend
  const legend = document.getElementById("legend");
  Object.entries(CAT_LABELS).forEach(([k,v])=>{
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-dot" style="background:${CAT_COLORS[k]}"></span>${v}`;
    legend.appendChild(item);
  });

  document.getElementById("link-count").textContent = LINKS.length;

  setupSvg();
  createElements();
  startSimulation();
  bindEvents();
}

function setupSvg() {
  const rect = svg.getBoundingClientRect();
  svg.setAttribute("viewBox",`${-rect.width/2} ${-rect.height/2} ${rect.width} ${rect.height}`);
}

function createElements() {
  // Links
  linkSel = g.selectAll ? null : null;
  const linkEls = [];
  links.forEach((l,i)=>{
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("class","link");
    line.dataset.source = l.source; line.dataset.target = l.target;
    g.appendChild(line);
    linkEls.push(line);
  });
  linkSel = linkEls;

  // Nodes
  const nodeEls = [];
  nodes.forEach(n=>{
    const grp = document.createElementNS("http://www.w3.org/2000/svg","g");
    grp.setAttribute("class","node");
    grp.dataset.id = n.id;
    const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("r", getNodeRadius(n));
    circle.setAttribute("fill", CAT_COLORS[n.cat] || "#58a6ff");
    circle.setAttribute("stroke", "#fff");
    circle.setAttribute("stroke-opacity","0.3");
    grp.appendChild(circle);
    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("y", getNodeRadius(n)+12);
    text.setAttribute("text-anchor","middle");
    text.textContent = n.label;
    grp.appendChild(text);
    g.appendChild(grp);
    nodeEls.push({el:grp,circle,text,n});
  });
  nodeSel = nodeEls;
}

function getNodeRadius(n) {
  const connections = LINKS.filter(l=>l.s===n.id||l.t===n.id).length;
  return Math.max(5, Math.min(16, 5 + connections));
}

// ===== SIMPLE PHYSICS (force-directed) =====
function startSimulation() {
  if (!physicsOn) return;
  let alpha = 1;
  const tick = () => {
    if (alpha < 0.005) return;
    alpha *= 0.995;
    // Repulsion
    for (let i=0;i<nodes.length;i++){
      for (let j=i+1;j<nodes.length;j++){
        let dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        let dist = Math.sqrt(dx*dx+dy*dy)||1;
        let force = 1200/dist/dist*alpha;
        nodes[i].vx -= dx/dist*force; nodes[i].vy -= dy/dist*force;
        nodes[j].vx += dx/dist*force; nodes[j].vy += dy/dist*force;
      }
    }
    // Attraction (links)
    links.forEach(l=>{
      const si = nodes.findIndex(n=>n.id===l.s), ti = nodes.findIndex(n=>n.id===l.t);
      if (si<0||ti<0) return;
      let dx = nodes[ti].x-nodes[si].x, dy = nodes[ti].y-nodes[si].y;
      let dist = Math.sqrt(dx*dx+dy*dy)||1;
      let force = (dist-80)*0.01*alpha;
      nodes[si].vx += dx/dist*force; nodes[si].vy += dy/dist*force;
      nodes[ti].vx -= dx/dist*force; nodes[ti].vy -= dy/dist*force;
    });
    // Center pull
    nodes.forEach(n=>{ n.vx -= n.x*0.001*alpha; n.vy -= n.y*0.001*alpha; });
    // Apply
    nodes.forEach(n=>{
      if (n.fx!==undefined){ n.x=n.fx; n.y=n.fy; n.vx=0; n.vy=0; return; }
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.9; n.vy *= 0.9;
    });
    render();
    requestAnimationFrame(tick);
  };
  // Initial positions
  nodes.forEach((n,i)=>{
    const angle = (i/nodes.length)*Math.PI*2;
    n.x = Math.cos(angle)*200; n.y = Math.sin(angle)*200;
  });
  requestAnimationFrame(tick);
}

function render() {
  const tx = transform.x, ty = transform.y, sc = transform.scale;
  const w = svg.getBoundingClientRect().width, h = svg.getBoundingClientRect().height;
  svg.setAttribute("viewBox", `${-w/2/sc + tx} ${-h/2/sc + ty} ${w/sc} ${h/sc}`);
  // Links
  linkSel.forEach(line=>{
    const s = nodes.find(n=>n.id===line.dataset.source);
    const t = nodes.find(n=>n.id===line.dataset.target);
    if(!s||!t) return;
    line.setAttribute("x1",s.x); line.setAttribute("y1",s.y);
    line.setAttribute("x2",t.x); line.setAttribute("y2",t.y);
  });
  // Nodes
  nodeSel.forEach(({el,n})=>{
    el.setAttribute("transform",`translate(${n.x},${n.y})`);
  });
}

function renderStatic() { render(); }

// ===== INTERACTIONS =====
function bindEvents() {
  let dragNode = null, isDragging = false, dragStart = {x:0,y:0};

  svg.addEventListener("mousedown", e => {
    const pos = getMousePos(e);
    const node = nodeSel.find(({n})=>Math.hypot(n.x-pos.x,n.y-pos.y)<getNodeRadius(n)+6);
    if (node) {
      dragNode = node;
      node.n.fx = node.n.x; node.n.fy = node.n.y;
      isDragging = false;
      dragStart = {x:e.clientX, y:e.clientY};
    } else {
      isDragging = true;
      dragStart = {x:e.clientX - transform.x, y:e.clientY - transform.y};
    }
  });

  window.addEventListener("mousemove", e => {
    if (dragNode && !isDragging && Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>3) isDragging = true;
    if (dragNode && isDragging) {
      const pos = getMousePos(e);
      dragNode.n.fx = pos.x; dragNode.n.fy = pos.y;
    } else if (isDragging) {
      transform.x = e.clientX - dragStart.x;
      transform.y = e.clientY - dragStart.y;
      render();
    } else {
      // Hover
      const pos = getMousePos(e);
      const node = nodeSel.find(({n})=>Math.hypot(n.x-pos.x,n.y-pos.y)<getNodeRadius(n)+6);
      handleHover(node, e);
    }
  });

  window.addEventListener("mouseup", () => {
    if (dragNode && !isDragging) {
      selectNode(dragNode.n);
      dragNode.n.fx = undefined; dragNode.n.fy = undefined;
    } else if (dragNode && isDragging) {
      dragNode.n.fx = undefined; dragNode.n.fy = undefined;
    }
    dragNode = null; isDragging = false;
  });

  // Zoom
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    transform.scale *= factor;
    transform.scale = Math.max(0.2, Math.min(4, transform.scale));
    render();
  }, {passive:false});

  // Search
  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    if (!q) { clearFilter(); return; }
    nodeSel.forEach(({el,n})=>{
      const match = n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || n.cat.includes(q);
      el.classList.toggle("dimmed", !match);
    });
    linkSel.forEach(line=>{
      const s = nodes.find(n=>n.id===line.dataset.source);
      const t = nodes.find(n=>n.id===line.dataset.target);
      line.classList.toggle("dimmed",
        !(s.label.toLowerCase().includes(q)||t.label.toLowerCase().includes(q)));
    });
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    transform = {x:0,y:0,scale:1};
    clearFilter();
    document.getElementById("search").value = "";
    closeDetails();
    render();
  });

  document.getElementById("btn-fit").addEventListener("click", () => {
    transform = {x:0,y:0,scale:1}; render();
  });

  document.getElementById("btn-physics").addEventListener("click", () => {
    physicsOn = !physicsOn;
    document.getElementById("btn-physics").classList.toggle("active", physicsOn);
    if (physicsOn) startSimulation(); else renderStatic();
  });
  document.getElementById("btn-physics").classList.toggle("active", physicsOn);

  document.getElementById("close-details").addEventListener("click", closeDetails);

  document.addEventListener("keydown", e => {
    if (e.key==="Escape") closeDetails();
    if (e.key==="ArrowLeft") { transform.x+=30; render(); }
    if (e.key==="ArrowRight") { transform.x-=30; render(); }
    if (e.key==="ArrowUp") { transform.y+=30; render(); }
    if (e.key==="ArrowDown") { transform.y-=30; render(); }
  });

  window.addEventListener("resize", render);
}

function getMousePos(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  // Account for viewBox offset
  const w = svg.getBoundingClientRect().width, h = svg.getBoundingClientRect().height;
  const sc = transform.scale;
  return { x: p.x + (w/2/sc), y: p.y + (h/2/sc) };
}

function handleHover(node, e) {
  const tt = document.getElementById("tooltip");
  if (!node) { tt.classList.remove("visible"); return; }
  const n = node.n;
  document.getElementById("tt-title").textContent = n.label;
  document.getElementById("tt-cat").textContent = CAT_LABELS[n.cat] || n.cat;
  document.getElementById("tt-desc").textContent = n.desc;
  const depsIn = LINKS.filter(l=>l.t===n.id).map(l=>nodes.find(x=>x.id===l.s)?.label).filter(Boolean);
  const depsOut = LINKS.filter(l=>l.s===n.id).map(l=>nodes.find(x=>x.id===l.t)?.label).filter(Boolean);
  let html = "";
  if (depsIn.length) html += `<div style="margin-top:6px;color:var(--muted);font-size:.75rem">← depende de</div>`;
  depsIn.forEach(d=>html+=`<span>${d}</span>`);
  if (depsOut.length) html += `<div style="margin-top:6px;color:var(--muted);font-size:.75rem">→ fornece para</div>`;
  depsOut.forEach(d=>html+=`<span>${d}</span>`);
  document.getElementById("tt-deps").innerHTML = html;
  tt.style.left = (e.clientX+14)+"px"; tt.style.top = (e.clientY+14)+"px";
  tt.classList.add("visible");
}

function selectNode(n) {
  const details = document.getElementById("details");
  document.getElementById("detail-title").textContent = n.label;
  const depsIn = LINKS.filter(l=>l.t===n.id).map(l=>nodes.find(x=>x.id===l.s)?.label).filter(Boolean);
  const depsOut = LINKS.filter(l=>l.s===n.id).map(l=>nodes.find(x=>x.id===l.t)?.label).filter(Boolean);
  let body = "";
  body += `<section><h4>Categoria</h4><div style="color:${CAT_COLORS[n.cat]}">${CAT_LABELS[n.cat]||n.cat}</div></section>`;
  body += `<section><h4>Descrição</h4><div>${n.desc}</div></section>`;
  if (depsIn.length) body += `<section><h4>Depende de (${depsIn.length})</h4><ul>${depsIn.map(d=>`<li>${d}</li>`).join("")}</ul></section>`;
  if (depsOut.length) body += `<section><h4>Fornecido para (${depsOut.length})</h4><ul>${depsOut.map(d=>`<li>${d}</li>`).join("")}</ul></section>`;
  document.getElementById("detail-body").innerHTML = body;
  details.classList.add("open");

  // Highlight in graph
  nodeSel.forEach(({el,id})=>el.classList.toggle("dimmed", id!==n.id));
  linkSel.forEach(line=>{
    const s = line.dataset.source, t = line.dataset.target;
    line.classList.toggle("highlighted", s===n.id||t===n.id);
    line.classList.toggle("dimmed", s!==n.id&&t!==n.id);
  });
}

function closeDetails() {
  document.getElementById("details").classList.remove("open");
  nodeSel.forEach(({el})=>el.classList.remove("dimmed"));
  linkSel.forEach(line=>{line.classList.remove("highlighted");line.classList.remove("dimmed");});
}

function clearFilter() {
  nodeSel.forEach(({el})=>el.classList.remove("dimmed"));
  linkSel.forEach(line=>line.classList.remove("dimmed"));
}

init();
</script>
</body>
</html>
